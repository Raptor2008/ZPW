<html>
    <head>
        <meta charset="UTF-8">
        <title>Zaliczenie jQuery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
         crossorigin="anonymous">
        </script>
        <script>
            $(document).ready(function(){
                let marginv = 0
                let marginh = 0

                $(document).on('keypress keydown', function(){
                    if(event.key == 'w'){
                        marginh = marginh - 10
                    }else if(event.key == 's'){
                        marginh = marginh + 10
                    }else if(event.key == 'a'){
                        marginv = marginv - 10
                    }else if(event.key == 'd'){
                        marginv = marginv + 10
                    }

                    $('#kwadrat').css('margin-top', marginh)
                    $('#kwadrat').css('margin-left', marginv)
                })

                let japkov = Math.floor(Math.random() * 1000)
                let japkoh = Math.floor(Math.random() * 1000)
                
                $('#japko').css('margin-top', japkov)
                $('#japko').css('margin-left', japkoh)


                let japkokwv = marginh < japkov

            })
        </script>
        <style>
            #kwadrat{
                width: 200px;
                height: 200px;
                background-color: rgba(255, 0, 0, 0.10);
                position: absolute;
            }

            #japko{
                background-color: rgb(172, 255, 47);
                height: 50px;
                width: 50px;
            }
        </style>
    </head>
    <body>
        <input type="text" id="pole">
        <p>
            Typ zdarzenia:
            <span id="eventType">---</span>
        </p>

        <p>
            Pozycja myszy:
            X = <span id="pageX">---</span>
            Y = <span id="pageY">---</span>
        </p>

        <div id="kwadrat"></div>
        <div id="japko"></div>
    </body>
</html>
