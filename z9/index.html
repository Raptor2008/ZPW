<html>
    <head>
        <meta charset="UTF-8">
        <title>Zaliczenie jQuery</title>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
         crossorigin="anonymous">
        </script>
        <script>
            $(document).ready(function(){
                ///Object event
                // $(document).on("keydown keyup keypress", function(event){
                //     $('#eventType').text(event.type)
                // })

                // $(document).on("mousemove", function(){
                //     $('#pageX').text(event.pageX)
                //     $('#pageY').text(event.pageY)
                // })

                let margin = 0
                let positon = 0

                $(document).on('keydown', function(event){
                    if(event.key == 'd'){
                        margin = margin + 100
                        $('#kwadrat').css('margin-left', margin)
                    }else if(event.key == 'a'){
                        margin = margin - 100
                        $('#kwadrat').css('margin-left', margin)
                    }else if(event.key == 'w'){
                        positon = positon - 200
                        $('#kwadrat').css('margin-top', positon)
                    }else if(event.key == 's'){
                        positon = positon + 200
                        $('#kwadrat').css('margin-top', positon)
                    }

                })

                let posx = Math.floor((Math.random() * 500) + 1)
                let posy = Math.floor((Math.random() * 500) + 1)

                $('#japko').css('margin-top', posx)
                $('#japko').css('margin-left', posy)

                let wkwadrat = 200

                if(margin == posx || positon == posy){
                    $('#japko').css('background-color', 'rgba(172, 255, 47, 0.0)')
                    wkwadrat = wkwadrat + 10
                    $('#kawadrat').css('width', wkwadrat)
                    $('#kawadrat').css('height', wkwadrat)
                }
            })
        </script>
        <style>
            #kwadrat{
                width: 200px;
                height: 200px;
                background-color: rgb(255, 0, 0);
                position: absolute;
            }

            #japko{
                background-color: rgb(172, 255, 47);
                height: 50px;
                width: 50px;
            }
        </style>
    </head>
    <body>
        <input type="text" id="pole">
        <p>
            Typ zdarzenia:
            <span id="eventType">---</span>
        </p>

        <p>
            Pozycja myszy:
            X = <span id="pageX">---</span>
            Y = <span id="pageY">---</span>
        </p>

        <div id="kwadrat"></div>
        <div id="japko"></div>
    </body>
</html>
